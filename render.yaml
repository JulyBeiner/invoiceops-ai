# Render Blueprint for InvoiceOps: one web service (Flask serves the API and the
# compiled React app from dist/) and one Postgres database.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: invoiceops
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash render_build.sh
    startCommand: gunicorn wsgi --chdir ./src/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceops-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: invoiceops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: invoiceops-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: invoiceops
    user: invoiceops
    ipAllowList: []
